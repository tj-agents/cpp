name: CI

on:
  push:
  pull_request:

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned workflow skill provider
        uses: actions/checkout@v4
        with:
          repository: Concertable/agent-standards
          ref: 93d8bd57fbfbd793acdebe542f7ae270a0c1d2a1
          path: external/agent-standards
      - name: Check generated payloads
        shell: pwsh
        run: .agents/sync-generated.ps1 -Check
      - name: Check hook syntax
        run: python3 -m py_compile .agents/hooks/session_context.py
      - name: Test session routing
        run: python3 -m unittest discover -s .agents/hooks/tests
      - name: Test marketplace and dependency contracts
        env:
          AGENT_STANDARDS_SOURCE: ${{ github.workspace }}/external/agent-standards
        run: python3 -m unittest discover -s .agents/tests
      - name: Check skill-route generator
        run: python3 .agents/gen_skill_routes.py --self-test
