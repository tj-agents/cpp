name: CI

on:
  push:
  pull_request:

jobs:
  python-standards:
    uses: tj-agents/template/.github/workflows/python-standards.yml@9db905b2a10a6a6d34e4b972192f0d59852f53e5

  generated:
    needs: python-standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: sync the locked Python tooling environment
        run: uv sync --locked
      - name: Install provenance verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg
          gpg --version
      - name: Check generated payloads
        shell: pwsh
        run: .agents/sync-generated.ps1 -Check
      - name: Check hook syntax
        run: python3 -m py_compile .agents/hooks/session_context.py
      - name: Test session routing
        run: uv run --locked pytest .agents/hooks/tests
      - name: Test marketplace and dependency contracts
        run: uv run --locked pytest .agents/tests
      - name: Check skill-route generator
        run: python3 .agents/gen_skill_routes.py --self-test
      - name: Install pinned marketplace harnesses
        run: npm install --global @openai/codex@0.154.0 @anthropic-ai/claude-code@2.1.268
      - name: Validate and install with Codex
        shell: bash
        run: |
          codex plugin marketplace add .
          for plugin in cpp gpp msvc win32; do
            codex plugin add "$plugin@tj-agents"
          done
          codex plugin list --json
      - name: Validate marketplace and plugins with Claude Code
        run: python3 .github/scripts/validate_claude.py --root .
