name: CI

on:
  push:
  pull_request:

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned core selection reader
        uses: actions/checkout@v4
        with:
          repository: tj-agents/core
          ref: c9b0037c2db7b0944ade86dd40667c67c5b65b4f
          path: .test-dependencies/core
      - name: Check source and shared-reader selection parity
        run: python3 .agents/tests/check_selection_profile_parity.py --reader .test-dependencies/core/.agents/machine/utility/bootstrap-capabilities/scripts/selection_profiles.py
      - name: Install provenance verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg
          gpg --version
      - name: Check generated payloads
        shell: pwsh
        run: .agents/sync-generated.ps1 -Check
      - name: Check hook syntax
        run: python3 -m py_compile .agents/hooks/session_context.py
      - name: Test session routing
        run: python3 -m unittest discover -s .agents/hooks/tests
      - name: Test marketplace and dependency contracts
        run: python3 -m unittest discover -s .agents/tests
      - name: Check skill-route generator
        run: python3 .agents/gen_skill_routes.py --self-test
      - name: Install pinned marketplace harnesses
        run: npm install --global @openai/codex@0.154.0 @anthropic-ai/claude-code@2.1.268
      - name: Validate and install with Codex
        shell: bash
        run: |
          codex plugin marketplace add .
          for plugin in cpp gpp msvc win32 base gcc windows cpp-standards gpp-standards; do
            codex plugin add "$plugin@cpp-agents"
          done
          codex plugin list --json
      - name: Validate marketplace and plugins with Claude Code
        shell: bash
        run: |
          claude plugin validate --strict .claude-plugin/marketplace.json
          for plugin in cpp gpp msvc win32 base gcc windows cpp-standards gpp-standards; do
            claude plugin validate --strict "plugins/$plugin"
          done
