name: External contract provenance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: read
  checks: read

jobs:
  repository-binding:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANONICAL_REPOSITORY: tj-agents/cpp
      EXPECTED_ATTESTER_ID: "183629855"
      EXPECTED_ATTESTER_LOGIN: tomjseery
      EXPECTED_PRODUCER_COMMIT: 93d8bd57fbfbd793acdebe542f7ae270a0c1d2a1
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      STATUS_CONTEXT: agent-standards/provenance
    steps:
      - name: Validate canonical pull-request identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull-request commit identity." >&2
            exit 1
          fi
          IFS=$'\t' read -r api_head_repository api_head_sha < <(
            gh api "repos/$CANONICAL_REPOSITORY/pulls/$PR_NUMBER" --jq '[.head.repo.full_name, .head.sha] | @tsv'
          )
          if [[ "$api_head_repository" != "$HEAD_REPOSITORY" || "$api_head_sha" != "$HEAD_SHA" ]]; then
            echo "The pull-request head does not match the canonical PR record." >&2
            exit 1
          fi
          if [[ "$HEAD_REPOSITORY" == "$CANONICAL_REPOSITORY" ]]; then
            remote_sha=$(gh api "repos/$CANONICAL_REPOSITORY/commits/$HEAD_SHA" --jq '.sha')
            if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
              echo "The pull-request head is not in the canonical repository." >&2
              exit 1
            fi
          fi

      - name: Check out trusted base and Git object graph
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require maintainer attestation for trust-contract changes
        shell: bash
        run: |
          set -euo pipefail

          requires_attestation=false

          is_protected_path() {
            local candidate="$1"
            case "$candidate" in
              .agents/plugins/skill-contract.json|\
              .agents/tests/test_attester_safety.py|\
              .agents/tests/test_marketplace_contract.py|\
              .agents/attest-external-contract.ps1|\
              contracts/*|\
              .github/workflows/attester-safety.yml|\
              .github/workflows/ci.yml|\
              .github/workflows/provenance-gate.yml)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          git cat-file -e "$BASE_SHA^{commit}"
          if [[ "$HEAD_REPOSITORY" == "$CANONICAL_REPOSITORY" ]]; then
            if ! git cat-file -e "$HEAD_SHA^{commit}"; then
              echo "The canonical PR head is absent from the fetched Git object graph." >&2
              exit 1
            fi
            changed_path_file="$RUNNER_TEMP/provenance-changed-paths.nul"
            git diff --name-status --find-renames -z "$BASE_SHA...$HEAD_SHA" >"$changed_path_file"
            while IFS= read -r -d '' status; do
              IFS= read -r -d '' path
              if is_protected_path "$path"; then
                requires_attestation=true
              fi
              case "$status" in
                R*|C*)
                  IFS= read -r -d '' path
                  if is_protected_path "$path"; then
                    requires_attestation=true
                  fi
                  ;;
              esac
            done <"$changed_path_file"
          else
            changed_files=$(gh api "repos/$CANONICAL_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')
            if [[ ! "$changed_files" =~ ^[0-9]+$ || "$changed_files" -gt 3000 ]]; then
              echo "Fork PR path inventory exceeds GitHub's complete enumeration limit." >&2
              exit 1
            fi
            files=$(gh api --paginate "repos/$CANONICAL_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[]' | jq -s '.')
            if [[ $(jq 'length' <<<"$files") != "$changed_files" ]]; then
              echo "Fork PR path inventory is incomplete." >&2
              exit 1
            fi
            while IFS= read -r path; do
              if is_protected_path "$path"; then
                requires_attestation=true
              fi
            done < <(jq -r '.[] | .filename, (.previous_filename // empty)' <<<"$files")
          fi

          if [[ "$requires_attestation" != true ]]; then
            echo "No external trust-contract paths changed."
            exit 0
          fi
          if [[ "$HEAD_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "Trust-contract changes must use a branch in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi

          evidence_blob=$(gh api \
            "repos/$CANONICAL_REPOSITORY/contents/contracts/concertable-0.1.6/provenance.json?ref=$HEAD_SHA" \
            --jq '.sha')
          if [[ ! "$evidence_blob" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid provenance evidence blob." >&2
            exit 1
          fi

          expected_description="agent-standards@${EXPECTED_PRODUCER_COMMIT:0:12}; evidence ${evidence_blob:0:12}"
          expected_target="https://github.com/Concertable/agent-standards/commit/$EXPECTED_PRODUCER_COMMIT"
          statuses=$(gh api --paginate \
            "repos/$CANONICAL_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" \
            --jq '.[]' | jq -s '.')

          collisions=$(jq --arg context "$STATUS_CONTEXT" '[
            .[] | select((.context | ascii_downcase) == ($context | ascii_downcase) and .context != $context)
          ] | length' <<<"$statuses")
          if [[ "$collisions" != "0" ]]; then
            echo "A case-colliding status context exists." >&2
            exit 1
          fi

          status=$(jq -c --arg context "$STATUS_CONTEXT" '[
            .[] | select(.context == $context)
          ][0] // empty' <<<"$statuses")
          if [[ -z "$status" ]]; then
            echo "Missing $STATUS_CONTEXT status for $HEAD_SHA. Run the repository attestation script, then rerun this job." >&2
            exit 1
          fi

          checks=$(gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/$CANONICAL_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '.check_runs[]' | jq -s '.')
          check_collisions=$(jq --arg context "$STATUS_CONTEXT" '[
            .[] | select((.name | ascii_downcase) == ($context | ascii_downcase))
          ] | length' <<<"$checks")
          if [[ "$check_collisions" != "0" ]]; then
            echo "A check run collides with the dedicated status context." >&2
            exit 1
          fi

          jq -e \
            --arg context "$STATUS_CONTEXT" \
            --arg description "$expected_description" \
            --arg target "$expected_target" \
            --arg login "$EXPECTED_ATTESTER_LOGIN" \
            --argjson id "$EXPECTED_ATTESTER_ID" \
            '.state == "success"
             and .context == $context
             and .description == $description
             and .target_url == $target
             and .creator.login == $login
             and .creator.id == $id' <<<"$status" >/dev/null

          echo "Verified repository-bound maintainer attestation for $HEAD_SHA."
